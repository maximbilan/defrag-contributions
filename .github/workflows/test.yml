name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-retries: 3 # the clone fails now and then on GitHub's side
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
